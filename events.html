<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | Pulse Systems</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101f;color:#e7efff;font:15px system-ui,Segoe UI,sans-serif}header{padding:22px max(24px,calc((100vw - 1080px)/2));background:#0b1a32;border-bottom:1px solid #24466d;display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:#86b9ff}h1{font-size:30px;margin:0}h2{font-size:19px;margin-top:0}.brand{color:#83b5ff;letter-spacing:.08em;font-weight:800}.wrap{max-width:1080px;margin:35px auto;padding:0 22px}.card{border:1px solid #24466d;border-radius:15px;background:#101f38;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px;margin:12px 0}label{font-weight:650;color:#b5d5ff}input,select,textarea{width:100%;background:#09172d;border:1px solid #36577b;color:#fff;border-radius:9px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}button{background:#336bff;border:0;color:white;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#223b5d}.event{border:1px solid #284b73;border-radius:10px;padding:15px;margin:12px 0}.muted{color:#a4b8d2;font-size:13px}.notice{padding:12px;border-radius:9px;background:#182e50;min-height:42px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#login{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr}header{padding:16px 22px}}</style></head>
<body><header><div class="brand">PULSE SYSTEMS / EVENTS</div><a href="dashboard.html">← Back to dashboard</a></header><main class="wrap"><h1>Server Events</h1><p class="muted">Create and manage announcements for each server separately. Requires Manage Server or Administrator.</p><div class="card"><div class="row"><div style="flex:1"><label for="guild">Select server</label><select id="guild"><option value="">Loading...</option></select></div><button id="login">Sign in with Discord</button><button id="logout" class="secondary" hidden>Log out</button></div><p class="notice" id="status" role="status">Connecting...</p></div><div class="grid"><section class="card"><h2>Create an event</h2><form id="create"><div class="field"><label for="title">Event title</label><input id="title" maxlength="150" required placeholder="Community Game Night"></div><div class="field"><label for="details">Description</label><textarea id="details" maxlength="900" required placeholder="What will happen at the event?"></textarea></div><div class="field"><label for="when">Date & time (include time zone)</label><input id="when" maxlength="200" required placeholder="12 October, 7 PM AEDT"></div><div class="field"><label for="location">Location or game link</label><input id="location" maxlength="300" required placeholder="Roblox game / voice channel"></div><div class="field"><label for="channel">Announcement channel</label><select id="channel" required><option value="">Choose a channel</option></select></div><button id="publish" type="submit">Publish event to Discord</button></form></section><section class="card"><h2>Recent events</h2><div id="events" class="muted">Select a server to view its events.</div></section></div></main>
<script src="dashboard-config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),api=(window.PULSE_API_BASE||'').replace(/\/$/,''),status=$('status');let csrf='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(s){status.textContent=s}async function request(path,method='GET',body){const r=await fetch(api+path,{method,credentials:'include',headers:{'Accept':'application/json','Content-Type':'application/json','X-Pulse-CSRF':csrf},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text()).slice(0,250)||'Request failed: '+r.status);return r.json()}async function load(){const id=$('guild').value;$('events').textContent='Loading...';$('channel').innerHTML='<option value="">Choose a channel</option>';if(!id){$('events').textContent='Select a server.';return}try{const [ev,ch]=await Promise.all([request('/api/guilds/'+id+'/events'),request('/api/guilds/'+id+'/event-channels')]);for(const c of ch.channels){const opt=document.createElement('option');opt.value=c.id;opt.textContent='#'+c.name;$('channel').append(opt)}$('events').innerHTML='';if(!ev.events.length){$('events').textContent='No events in this server yet.'}for(const e of ev.events){const div=document.createElement('div');div.className='event';const active=e.ended_at===null;div.innerHTML='<b>'+esc(e.title)+'</b><p class="muted">'+(active?'Active':'Ended')+' • '+new Date(e.created_at*1000).toLocaleString()+'</p><p class="muted">Host ID: '+esc(e.host_id)+'</p>';if(active){const b=document.createElement('button');b.textContent='End event';b.className='secondary';b.onclick=async()=>{if(!confirm('End this event and post a closing message?'))return;b.disabled=true;try{await request('/api/guilds/'+id+'/events/'+e.id+'/end','POST');msg('Event ended successfully.');await load()}catch(err){msg(err.message);b.disabled=false}};div.append(b)}$('events').append(div)}msg('Managing events for the selected server.')}catch(err){msg(err.message);$('events').textContent='Unable to load events.'}}$('guild').addEventListener('change',load);$('create').addEventListener('submit',async e=>{e.preventDefault();const id=$('guild').value;if(!id)return msg('Select a server first.');const b=$('publish');b.disabled=true;try{const result=await request('/api/guilds/'+id+'/events','POST',{title:$('title').value,details:$('details').value,when:$('when').value,location:$('location').value,channel_id:$('channel').value});$('create').reset();msg('Event published successfully: '+result.message_url);await load()}catch(err){msg(err.message)}finally{b.disabled=false}});$('login').onclick=()=>location.href=api+'/api/login';$('logout').onclick=async()=>{try{await request('/api/logout','POST')}finally{location.reload()}};async function init(){if(!api||api.includes('SET-YOUR-API-HOST'))return msg('Set PULSE_API_BASE in dashboard-config.js.');try{const me=await request('/api/me');csrf=me.csrf;$('logout').hidden=false;const result=await request('/api/guilds');$('guild').innerHTML='<option value="">Choose a server</option>';for(const g of result.guilds){const o=document.createElement('option');o.value=g.id;o.textContent=g.name;$('guild').append(o)}if(result.guilds.length){$('guild').value=result.guilds[0].id;await load()}else msg('No servers available.')}catch(err){msg('Sign in to manage events. '+err.message);$('login').style.display='inline-block'}}init()})();
</script></body></html>
