<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Pulse Systems</title><link rel="stylesheet" href="pulse-site.css"></head><body><header class="top"><a class="brand" href="index.html"><img src="pulse-logo.png" alt="Pulse Systems">PULSE SYSTEMS</a><nav class="links"><a href="index.html#features">Features</a><a href="index.html#about">About</a><a href="login.html">Dashboard</a><a class="btn" href="https://discord.com/oauth2/authorize?client_id=1556879045915050004&permissions=8&integration_type=0&scope=bot+applications.commands">Add to Discord →</a></nav></header><main class="authwrap"><div class="authcard"><img src="pulse-logo.png" alt="Pulse Systems logo"><h1>Pulse Systems</h1><p>Connect your Discord account to manage your servers and settings.</p><a class="btn" href="#" id="signin">◈ Sign In with Discord →</a><small>By connecting, you agree to our <a href="privacy.html">Privacy Policy</a>.</small><p id="authError" class="muted" role="status"></p></div></main><script src="dashboard-config.js"></script><script>const api=(window.PULSE_DASHBOARD_CONFIG?.apiBaseUrl||'').replace(/\/$/,'');document.getElementById('signin').onclick=e=>{e.preventDefault();if(!api||api.includes('SET-YOUR')){document.getElementById('authError').textContent='Configure dashboard-config.js first.';return}location.href=api+'/api/login'};if(api)fetch(api+'/api/me',{credentials:'include'}).then(r=>{if(r.ok)location.replace('servers.html')}).catch(()=>{});</script></body></html>
